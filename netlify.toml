[build]
  publish = "."

[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

[[redirects]]
  from = "/thank-you"
  to = "/#contact"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 1 year (incl. subdomains) — eligible for browser preload list
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Stop browsers from MIME-sniffing responses into a different content type
    X-Content-Type-Options = "nosniff"
    # Block the site from being embedded in iframes elsewhere (clickjacking)
    X-Frame-Options = "SAMEORIGIN"
    # Don't leak full URLs to other sites in the Referer header
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Lock down where resources can load from. 'unsafe-inline' is required
    # because the page uses inline styles, inline scripts and onclick handlers.
    # Everything else is restricted to this site only.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    # Disable browser features the site doesn't use (camera, mic, location, etc.)
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()"
    # Isolate this site's browsing context from other windows/origins
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
